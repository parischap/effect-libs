# ************** This file is automatically generated. Any modifications will be lost ************************

name: Release
on:
  release:
    types:
      - published
permissions:
  id-token: write
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Ensure mytsdevs release tag
        env:
          GH_TOKEN: ${{ secrets.MYTSDEVS_PAT }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          top=parischap/mytsdevs
          topTag=effect-libs-$TAG
          
          existing=$(gh api "repos/$top/git/ref/tags/$topTag" --jq .object.sha 2>/dev/null || true)
          
          if [ -n "$existing" ]; then
            pin=$(gh api "repos/$top/contents/packages/effect-libs?ref=$existing" --jq .sha)
            if [ "$pin" != "$RELEASE_SHA" ]; then
              echo "mytsdevs tag $topTag pins effect-libs at $pin, not at release commit $RELEASE_SHA"
              exit 1
            fi
            echo "mytsdevs tag $topTag already exists"
          else
            sha=$(gh api "repos/$top/commits/main" --jq .sha)
            pin=$(gh api "repos/$top/contents/packages/effect-libs?ref=$sha" --jq .sha)
            if [ "$pin" != "$RELEASE_SHA" ]; then
              echo "mytsdevs main pins effect-libs at $pin, not at release commit $RELEASE_SHA"
              echo "push the submodule pin update to mytsdevs before publishing the release"
              exit 1
            fi
            gh api "repos/$top/git/refs" --method POST -f ref="refs/tags/$topTag" -f sha="$sha"
          fi
          
      - name: Checkout mytsdevs workspace
        uses: actions/checkout@v6.0.2
        with:
          repository: parischap/mytsdevs
          ref: effect-libs-${{ github.event.release.tag_name }}
          token: ${{ secrets.MYTSDEVS_PAT }}
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          run_install: true
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: latest
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - name: Check release tag matches package.json version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$TAG" != "0.1.3" ]; then
            echo "Release tag '$TAG' does not match package.json version '0.1.3'"
            gh release delete "$TAG" --yes
            git push --delete origin "$TAG"
            exit 1
          fi
          
      - name: Check mytsdevs tag pins this release commit
        run: |
          git -C packages/effect-libs fetch origin --tags
          pinned=$(git -C packages/effect-libs rev-parse HEAD)
          tagged=$(git -C packages/effect-libs rev-parse "$TAG^{}")
          if [ "$pinned" != "$tagged" ]; then
            echo "mytsdevs tag effect-libs-$TAG pins effect-libs at $pinned, not at release tag $tagged"
            exit 1
          fi
          
      - name: Build and publish
        working-directory: packages/effect-libs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: pnpm configs build all && pnpm release-all